[build-system]
requires = ["setuptools>=61.0", "wheel", "setuptools_scm>=6.2"]
build-backend = "setuptools.build_meta"

[project]
name = "framesource"
# version is derived from git tags via setuptools_scm
dynamic = ["version"]
description = "A flexible, extensible Python framework for acquiring frames from cameras, video files, image folders, screen capture, and audio spectrograms with built-in frame processors."
authors = [
    { name = "Oliver Hamilton" }
]
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
keywords = [
    "camera",
    "computer-vision",
    "video-capture",
    "webcam",
    "rtsp",
    "realsense",
    "basler",
    "screen-capture",
    "frame-grabber",
    "opencv",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Video :: Capture",
    "Topic :: Scientific/Engineering :: Image Processing",
    "Typing :: Typed",
]
dependencies = [
    "opencv-python",
    "numpy",
    "mss",
    "numba",
    "watchdog",
    "cv2-enumerate-cameras",
    "pywin32; platform_system=='Windows'",
    "pyobjc-framework-Quartz; platform_system=='Darwin'"
]

[project.urls]
Homepage = "https://github.com/olkham/FrameSource"
Repository = "https://github.com/olkham/FrameSource"
Issues = "https://github.com/olkham/FrameSource/issues"

[project.optional-dependencies]
audio = [
    "librosa",
    "soundfile", 
    "pyaudio"
]
basler = [
    "pypylon"
]
realsense = [
    "pyrealsense2"
]
genicam = [
    "harvesters"
]
full = [
    "librosa",
    "soundfile",
    "pyaudio",
    "pypylon",
    "pyrealsense2",
    "harvesters"
]

[tool.ruff]
line-length = 100
target-version = "py39"
extend-exclude = ["src/framesource/sources/mvsdk.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.mypy]
ignore_missing_imports = true

# The vendor-SDK-heavy sources are exempt from strict typing until their
# second typing pass; the core modules below are strict. Order matters:
# for overlapping patterns the later section wins, and video_capture_base
# matches both.
[[tool.mypy.overrides]]
module = ["framesource.sources.*"]
disallow_untyped_defs = false

[[tool.mypy.overrides]]
module = [
    "framesource.sources.video_capture_base",
    "framesource.factory",
    "framesource.threading_utils",
]
disallow_untyped_defs = true

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q"
testpaths = ["tests"]
markers = [
    "hardware: tests that require physical capture hardware (deselected by default with -m 'not hardware')",
]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"framesource" = ["py.typed"]
"framesource.sources" = ["mvsdk.py"]

[tool.setuptools_scm]
write_to = "src/framesource/_version.py"
fallback_version = "0.2.7"
